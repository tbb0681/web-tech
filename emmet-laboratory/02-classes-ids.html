
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes and IDs</title>
</head>
<body>

    <header class="site-header">
        <h1>My Personal Website</h1>
        <p class="tagline">Welcome to my website!</p>
    </header>

    <nav id="main-nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="content">

        <section id="home" class="content-section">
            <h2>Home</h2>
            <p class="description">Welcome to my personal website.</p>
        </section>

        <section id="about" class="content-section">
            <h2>About Me</h2>
            <p class="description">I am an Information Technology student learning web development.</p>
        </section>

        <section id="contact" class="content-section">
            <h2>Contact Me</h2>
            <p class="description">Thank you for visiting my website!</p>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 My Personal Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
