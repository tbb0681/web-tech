
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    
<form>

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required placeholder="Enter full name">

    <br><br>

    <label for="StudentID">Student ID:</label>
    <input type="text" id="StudentID" name="StudentID" required placeholder="Enter ID number">

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required placeholder="Enter email address">

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required placeholder="Enter Password">

    <br><br>

    <label for="birthday">Birthday:</label>
    <input type="date" id="birthday" name="birthday" >

    <br><br>

    <label for="gender">Gender:</label>

    <br>

    <input type="radio" id="female" name="gender">
    <label for="female">Female</label>

    <input type="radio" id="male" name="gender">
    <label for="male">Male</label>

    <br><br>

    <label for="program">Program:</label>
    <input type="text" id="program" name="program" placeholder="Enter program">

    <br><br>

    
<label>Hobbies:</label>

<br>

<small>(Select all that apply)</small>

<br>

<input type="checkbox" id="reading" name="hobbies" value="Reading">
<label for="reading">Reading</label>

<br>

<input type="checkbox" id="gaming" name="hobbies" value="Gaming">
<label for="gaming">Gaming</label>

<br>

<input type="checkbox" id="music" name="hobbies" value="Listening to Music">
<label for="music">Listening to Music</label>

<br>

<input type="checkbox" id="traveling" name="hobbies" value="Traveling">
<label for="traveling">Traveling</label>

<br>

<input type="checkbox" id="drawing" name="hobbies" value="Drawing">
<label for="drawing">Drawing</label>

<br>

<input type="checkbox" id="dancing" name="hobbies" value="dancing">
<label for="dancing">Dancing</label>

<br><br>

<label for="address">Address:</label>
    <input type="text" id="address" name="address" placeholder="Enter address">

    <br><br>

    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option>BSIT</option>
        <option>BSCS</option>
        <option>BSIS</option>
    </select>

    <br><br>

    <label for="message">Why did you choose this course?</label>
    <br>
    <textarea id="message" name="message" minlength="50" maxlength="300"></textarea>

    <br><br>

    <button type="submit">Register</button>
    <button type="reset">Reset</button>

</form>


</body>
</html>
